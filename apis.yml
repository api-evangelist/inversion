aid: inversion
name: Inversion
description: 'Inversion is a Los Angeles-based aerospace and defense company founded in 2021 by Austin
  Briggs and Justin Fiaschetti, building a new class of highly maneuverable reentry vehicles. Its flagship
  Arc is an autonomous, reusable, low-cost space-based delivery vehicle designed to store cargo in orbit
  and deliver it with precision to anywhere on Earth in under an hour, descending under parachutes using
  non-toxic propellants so crews can approach it immediately on landing. The company also develops hypersonics
  and space-based interceptor technology and flew its first reentry capsule, Ray, as an early technical
  demonstrator. Inversion has raised roughly $54M to date, including a $44M Series A led by Spark Capital
  and Adjacent with participation from Lockheed Martin Ventures, Kindred Ventures, and Y Combinator. It
  does not currently publish a public developer API; this profile tracks the company for the API Evangelist
  network.'
